name: Install and start K3s
runs:
  using: composite
  steps:
    - run: |
        export INSTALL_K3S_EXEC
        if [ -e /var/run/crio/crio.sock ] ; then
            INSTALL_K3S_EXEC="--container-runtime-endpoint /var/run/crio/crio.sock"
            ( echo '[crio.network]' ; echo 'plugin_dirs = [ "/var/lib/rancher/k3s/data/cni" ]' ; echo 'network_dir = "/var/lib/rancher/k3s/agent/etc/cni/net.d"' ) | sudo tee /etc/crio/crio.conf.d/20-cni.conf
            sudo systemctl restart crio.service
        elif [ -e /var/run/docker.sock ] ; then
            INSTALL_K3S_EXEC="--docker --kubelet-arg=allowed-unsafe-sysctls=net.ipv6.conf.all.disable_ipv6"
        elif [ -e /var/run/containerd/containerd.sock ] ; then
            INSTALL_K3S_EXEC="--container-runtime-endpoint /var/run/containerd/containerd.sock"
            cat tests/containerd-2.1-config-k3s.toml | sudo tee -a /etc/containerd/config.toml
            sudo systemctl restart containerd
        else
            sudo mkdir -p /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
            sudo cp tests/containerd-2.1-config.toml /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/cgroups.toml
        fi
        sudo mkdir -p /etc/rancher/k3s/config.yaml.d
        sudo cp tests/k3s-config-minimize.yaml /etc/rancher/k3s/config.yaml.d/k3s-config-minimize.yaml
        curl -sSL --fail-with-body https://get.k3s.io \
            | sh -s - \
                --write-kubeconfig ~/.kube/config --write-kubeconfig-mode 640 --write-kubeconfig-group $( id -g )
      shell: bash -euxo pipefail {0}
    - uses: ./.github/actions/wait-for-k8s
    - run: |
        # Make local-path provisioner on userns remapped docker setup on cgroups v2 work
        # -- the pods of the cluster run remapped as well
        sudo mkdir -p /var/lib/rancher/k3s/storage
        sudo chown $( id -u ) /var/lib/rancher/k3s/storage

        ( for i in $( seq 10 ) ; do ip link show cni0 > /dev/null && exit ; set +x ; sleep 3 ; done ; false )
        sudo resolvectl dns cni0 $( kubectl get -n kube-system service/kube-dns -o 'jsonpath={.spec.clusterIP}' )
        sudo resolvectl domain cni0 cluster.local

        kubectl apply -f tests/freeipa-coredns-custom.yaml
        ( for i in $( seq 10 ) ; do dig +short kubernetes.default.svc.cluster.local | grep . && exit ; set +x ; sleep 5 ; done ; false )
      shell: bash -euxo pipefail {0}
