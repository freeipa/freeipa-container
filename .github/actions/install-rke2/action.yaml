name: Install and start RKE2
runs:
  using: composite
  steps:
    - id: rke2-date
      run: date '+date=%F' >> "$GITHUB_OUTPUT"
      shell: bash -euxo pipefail {0}
    - uses: actions/cache@v6
      with:
        path: ~/.cache/rke2-stable-release
        key: rke2-stable-release-seen-${{ steps.rke2-date.outputs.date }}
        restore-keys: rke2-stable-release-seen-
    - id: rke2-version
      name: Get latest stable RKE2 version
      run: |
        d=~/.cache/rke2-stable-release
        mkdir -p "$d"
        rke2_version() { sed -n '/^location:/I { s|.*/||; s/%2B/+/; s/\r$//; p }' "$1" 2>/dev/null || true ; }
        version=
        if curl -sSi --fail-with-body -o "$d/response.in" https://update.rke2.io/v1-release/channels/stable ; then
            version=$( rke2_version "$d/response.in" )
            [ -z "$version" ] || mv "$d/response.in" "$d/response"
        fi
        if [ -z "$version" ] ; then
            echo "::warning::update.rke2.io did not return a stable release location"
            if [ -f "$d/response" ] ; then
                echo "using cached response"
                cat "$d/response"
                version=$( rke2_version "$d/response" )
            fi
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
      shell: bash -euxo pipefail {0}
    - name: Run curl -sSL --fail-with-body https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${{ env.INSTALL_RKE2_VERSION }}" sh -
      run: |
        sudo rm -f /etc/cni/net.d/*.conflist
        sudo mkdir -p /etc/rancher/rke2/config.yaml.d
        if [ -e /var/run/crio/crio.sock ] ; then
            echo "container-runtime-endpoint: /var/run/crio/crio.sock" | sudo tee /etc/rancher/rke2/config.yaml.d/70-crio.yaml
        elif [ -e /var/run/containerd/containerd.sock ] ; then
            echo "container-runtime-endpoint: /var/run/containerd/containerd.sock" | sudo tee /etc/rancher/rke2/config.yaml.d/70-containerd.yaml
        fi
        ( echo 'disable:' ; echo ' - rke2-metrics-server' ) | sudo tee /etc/rancher/rke2/config.yaml.d/disable-metrics-server.yaml
        sudo mkdir -p /var/lib/rancher/rke2/server/manifests
        sudo cp tests/rke2-helm-coredns-config.yaml /var/lib/rancher/rke2/server/manifests/rke2-coredns-config.yaml

        curl -sSL --fail-with-body https://get.rke2.io | sudo INSTALL_RKE2_VERSION="$INSTALL_RKE2_VERSION" sh -
        sudo systemctl start rke2-server.service
        systemctl status rke2-server.service
        mkdir ~/.kube
        sudo cat /etc/rancher/rke2/rke2.yaml > ~/.kube/config
        sudo ln -s /var/lib/rancher/rke2/bin/kubectl /usr/local/bin
        kubectl apply -f tests/freeipa-coredns-custom.yaml
      env:
        INSTALL_RKE2_VERSION: ${{ steps.rke2-version.outputs.version }}
      shell: bash -euxo pipefail {0}
    - uses: ./.github/actions/wait-for-k8s
    - run: |
        kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
        kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
        # Remove the extremely permissive ACLs / mask that GitHub runners have on /opt
        # which prevents sssd.service from starting due to
        # [sssd] [access_check_file] (0x0020): Unexpected access to '/etc/sssd/sssd.conf' by other users
        sudo mkdir /opt/local-path-provisioner
        sudo setfacl -b /opt/local-path-provisioner

        ( for i in $( seq 10 ) ; do ip link show flannel.1 && exit ; set +x ; sleep 3 ; done ; false )
        sudo resolvectl dns flannel.1 $( kubectl get -n kube-system service/rke2-coredns-rke2-coredns -o 'jsonpath={.spec.clusterIP}' )
        sudo resolvectl domain flannel.1 cluster.local
        ( for i in $( seq 10 ) ; do dig +short kubernetes.default.svc.cluster.local | grep . && exit ; set +x ; sleep 5 ; done ; false )
      shell: bash -euxo pipefail {0}
