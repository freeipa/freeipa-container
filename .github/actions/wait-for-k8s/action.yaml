name: Wait for Kubernetes to be up
runs:
  using: composite
  steps:
    - name: Wait for a Ready node and the serviceaccount/default
      run: |
        ( for i in $( seq 10 ) ; do ( set -x ; kubectl get nodes ) | tee /dev/stderr | grep '\bReady\b' > /dev/null && exit ; sleep 5 ; done ; false )
        ( for i in $( seq 10 ) ; do ( set -x ; kubectl get serviceaccount/default ) && exit ; sleep 5 ; done ; false )
      shell: bash -euo pipefail {0}
    - name: Wait for kubectl get pods --all-namespaces
      run: |
        ( set -x ; kubectl get pods --all-namespaces )
        ( for i in $( seq 10 ) ; do echo --- ; ! kubectl get pods -A 2>&1 | grep -E 'Pending|ContainerCreating|CrashLoopBackOff|Init|No resources found' && exit ; set +x ; sleep 5 ; done ; false )
        echo ---
        kubectl get pods --all-namespaces
      shell: bash -euo pipefail {0}
