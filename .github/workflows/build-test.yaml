name: Build and test FreeIPA containers
run-name: Build and test FreeIPA containers${{ github.event_name == 'workflow_dispatch' && format(' ({0})', inputs.os) || ''}}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: OS / Dockerfile
        type: choice
        options:
          - all
          - fedora-rawhide
          - fedora-44
          - fedora-43
          - almalinux-10
          - almalinux-9
          - almalinux-8
          - rocky-9
          - rocky-8
          - centos-10-stream
          - centos-9-stream
  schedule:
    - cron: '15 4 * * 1,3,5'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  init:
    name: Process workflow inputs
    runs-on: ubuntu-slim
    timeout-minutes: 1
    if: github.event_name != 'schedule' || github.repository == 'freeipa/freeipa-container'
    outputs:
      os: ${{ steps.generate-os-list-dispatch-one.outputs.os }}${{ steps.generate-os-list-all.outputs.os }}
    steps:
      - id: generate-os-list-dispatch-one
        if: github.event_name == 'workflow_dispatch' && inputs.os != 'all'
        run: jq -ncj '"os=", [ $ENV["INPUT_OS"] ], "\n"' | tee $GITHUB_OUTPUT
        env:
          INPUT_OS: ${{ inputs.os }}
      - uses: actions/checkout@v6
        if: github.event_name != 'workflow_dispatch' || inputs.os == 'all'
      - id: generate-os-list-all
        if: github.event_name != 'workflow_dispatch' || inputs.os == 'all'
        run: |
          yq '.on.workflow_dispatch.inputs.os.options | map(select(. != "all"))' .github/workflows/build-test.yaml -o json \
            | jq -cj '"os=", ., "\n"' | tee $GITHUB_OUTPUT
  build:
    name: Build image
    runs-on: ubuntu-24.04${{ (matrix.arch == 'arm64' && '-arm') || (matrix.arch == 'x86_64' && '') }}
    needs: [ init ]
    if: needs.init.outputs.os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.init.outputs.os ) }}
        arch: [ x86_64, arm64 ]
        docker: [ docker ]
        exclude:
          - os: fedora-44
            arch: arm64
          - os: fedora-43
            arch: arm64
          - os: centos-10-stream
            arch: x86_64
          - os: centos-9-stream
            arch: arm64
          - os: almalinux-8
            arch: arm64
          - os: rocky-8
            arch: arm64
    timeout-minutes: 15
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      docker: ${{ matrix.docker }}
    steps:
      - uses: actions/checkout@v6
      - name: Separate git work tree with just the files needed for build
        run: git worktree add --no-checkout ../minimize-for-build
      - name: Populate with the Dockerfile
        run: cd ../minimize-for-build && git checkout HEAD "Dockerfile.$OS"
      - name: Populate with files referenced from the Dockerfile
        run: cd ../minimize-for-build && awk '/^(ADD|COPY)/ { for (i = 2; i < NF; i++) print $i }' "Dockerfile.$OS" | while read f ; do git checkout HEAD $f ; done
      - name: Ensure docker images sees the named parent image
        run: awk '$1 == "FROM" { print $2 ; exit }' "../minimize-for-build/Dockerfile.$OS" | xargs $docker pull
      - name: Build image
        run: $docker build -t "localhost/freeipa-server:$OS" -f "Dockerfile.$OS" ../minimize-for-build

      - name: Create directory for artifacts
        run: mkdir "freeipa-server-$OS-$ARCH"
      - name: Save image
        run: $docker save "localhost/freeipa-server:$OS" > "freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar"
        if: matrix.docker == 'docker'
      - name: Workaround https://github.com/actions/runner-images/issues/10443
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.docker == 'podman'
      - name: Get OCI archive from podman
        run: skopeo copy "containers-storage:localhost/freeipa-server:$OS" "oci-archive:freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar"
        if: matrix.docker == 'podman'
      - name: Label the built image
        run: ./ci/label-image.sh "freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar" "Dockerfile.$OS" "localhost/freeipa-server:$OS" $( cd ../minimize-for-build && git write-tree ) "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "actions/runs/$GITHUB_RUN_ID"
      - name: File issue if building image failed
        if: failure() && github.event_name == 'schedule'
        run: |
          curl -s "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?labels=image-build-fail" | jq -r '.[0].state' | grep open \
          || jq -n -f /dev/stdin <<'EOS' \
            | tee /dev/stderr \
            | curl -sS --fail-with-body -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '@-' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues"
          {
            "title": ( "Image build for $OS failed on " + ( now | strftime("%F") )),
            "body": ( "This issue was automatically created by GitHub Action\n\n" + $ENV.RUN_URL + "\n" ),
            "labels": [ "image-build-fail" ]
          }
          EOS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - run: gzip "freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar"
      - uses: actions/upload-artifact@v6
        with:
          name: freeipa-server-${{ matrix.os }}-${{matrix.arch}}
          path: freeipa-server-${{ matrix.os }}-${{matrix.arch}}
          retention-days: 1
        background: true
      - run: |
          mkdir -p "build-status/$OS-$ARCH"
          printf -- "- os: %s\n  arch: %s\n" "$OS" "$ARCH" > "build-status/$OS-$ARCH"/build-dist
      - name: Check resulting labels
        run: |
          skopeo inspect "oci-archive:freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar.gz" | jq '.Labels'
          CHECK_REPO=quay.io/freeipa/freeipa-server
          diff -u <( skopeo inspect "docker://$CHECK_REPO:$OS" | jq '.Labels' ) <( skopeo inspect "oci-archive:freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar.gz" | jq '.Labels' ) || true
          if cmp \
            <( skopeo inspect "docker://$CHECK_REPO:$OS" \
              | jq -r '.Labels."org.opencontainers.image.base.digest", .Labels."org.opencontainers.image.version"' ) \
            <( skopeo inspect "oci-archive:freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar.gz" \
              | jq -r '.Labels."org.opencontainers.image.base.digest", .Labels."org.opencontainers.image.version"' ) ; then
            echo "Newly built freeipa-server:$OS is the same as image at $CHECK_REPO."
          else
            cp "build-status/$OS-$ARCH/build-dist" "build-status/$OS-$ARCH/fresh-image"
          fi
      - name: Check resulting annotations
        run: |
          tar xz -O -f "freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar.gz" index.json | jq '.manifests[].annotations'
          skopeo inspect --raw "oci-archive:freeipa-server-$OS-$ARCH/freeipa-server-$OS-$ARCH.tar.gz" | jq .annotations
      - name: Check for nopush
        run: |
          if yq '.push.exclude[]' .github/build-test-params.yaml -o json \
              | jq -c --arg os "$OS" --arg arch "$ARCH" '. as $input | ( $ARGS.named | { os, arch } | with_entries(select(.value != null))) | select(contains($input))' \
              | grep .  ; then
            rm -f "build-status/$OS-$ARCH/fresh-image"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: build-status-${{ matrix.os }}-${{ matrix.arch }}
          path: build-status
          retention-days: 1
        background: true
      - wait-all:

  test-plan:
    name: FreeIPA test plan
    runs-on: ubuntu-slim
    needs: [ build ]
    timeout-minutes: 1
    if: github.event_name != 'schedule' || github.repository == 'freeipa/freeipa-container'
    outputs:
      matrix-run: ${{ steps.produce-matrix.outputs.matrix-run }}
      matrix-test-upgrade: ${{ steps.produce-matrix.outputs.matrix-test-upgrade }}
      matrix-k8s: ${{ steps.produce-matrix.outputs.matrix-k8s }}
      matrix-push: ${{ steps.produce-matrix.outputs.matrix-push }}
      matrix-push-data: ${{ steps.produce-matrix.outputs.matrix-push-data }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: build-status-*
          path: build-status
          merge-multiple: true
      - name: Amend the .github/build-test-params.yaml with information about built images
        run: |
          (
              echo 'build-dist:'
              yq '.jobs.build.strategy.matrix.arch as $arch | .on.workflow_dispatch.inputs.os.options[] | select(. != "all") | . + "-" + $arch[]' .github/workflows/build-test.yaml \
              | while read i ; do
                if [ -f build-status/$i/build-dist ] ; then cat build-status/$i/build-dist ; fi
              done
              echo 'fresh-dist:'
              cat build-status/*/fresh-image || :
              cat .github/build-test-params.yaml
          ) | yq . - -o json | tee .github/build-test-data.json
      - id: produce-matrix
        run: |
          jq -f ci/generate-test-matrix.jq --arg job run .github/build-test-data.json \
              | tee /dev/stderr \
              | tee >( jq -cj '"matrix-run=", ., "\n"' >> $GITHUB_OUTPUT ) \
              | jq -rf ci/test-matrix-to-html.jq --arg job run --argjson build-dist "$( jq -c '.["build-dist"]' .github/build-test-data.json )" >> $GITHUB_STEP_SUMMARY
          jq -f ci/generate-test-matrix.jq --arg job test-upgrade .github/build-test-data.json \
              | tee /dev/stderr \
              | tee >( jq -cj '"matrix-test-upgrade=", ., "\n"' >> $GITHUB_OUTPUT ) \
              | jq -rf ci/test-matrix-to-html.jq --arg job test-upgrade --argjson build-dist "$( jq -c '.["build-dist"]' .github/build-test-data.json )" >> $GITHUB_STEP_SUMMARY
          jq -f ci/generate-test-matrix.jq --arg job k8s .github/build-test-data.json \
              | tee /dev/stderr \
              | tee >( jq -cj '"matrix-k8s=", ., "\n"' >> $GITHUB_OUTPUT ) \
              | jq -rf ci/test-matrix-to-html.jq --arg job k8s --argjson build-dist "$( jq -c '.["build-dist"]' .github/build-test-data.json )" >> $GITHUB_STEP_SUMMARY
          jq -f ci/generate-test-matrix.jq -c --arg job push .github/build-test-data.json \
              | tee /dev/stderr \
              | jq -cj '"matrix-push=", ., "\n"' >> $GITHUB_OUTPUT
          jq -f ci/generate-test-matrix.jq -c --arg job push-data .github/build-test-data.json \
              | tee /dev/stderr \
              | jq -cj '"matrix-push-data=", ., "\n"' >> $GITHUB_OUTPUT
      - run: jq -n -rf ci/test-matrix-to-html.jq --arg job legend >> $GITHUB_STEP_SUMMARY

  build-ipa-client:
    name: Ensure ipa-client image in cache
    runs-on: ubuntu-26.04${{ (matrix.arch == 'arm64' && '-arm') || (matrix.arch == 'x86_64' && '') }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: date '+MONTH=%Y-%m' | tee -a $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ipa-client.tar.gz
          key: ipa-client-${{ env.MONTH }}-${{ hashFiles('Dockerfile.test-client') }}-${{ matrix.arch }}
          lookup-only: true
        id: cache-ipa-client
      - run: |
          docker build -t localhost/ipa-client -f Dockerfile.test-client .
          docker save localhost/ipa-client | gzip > ipa-client.tar.gz
        if: steps.cache-ipa-client.outputs.cache-hit != 'true'

  master-and-replica:
    name: Run
    runs-on: ${{ matrix.runs-on }}${{ (matrix.arch == 'arm64' && '-arm') || (matrix.arch == 'x86_64' && '') }}
    needs: [ build, test-plan, build-ipa-client ]
    if: needs.test-plan.outputs.matrix-run != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-plan.outputs.matrix-run) }}
    timeout-minutes: 40
    env:
      runtime: ${{ matrix.runtime == 'docker rootless' && 'docker' || matrix.runtime }}
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: freeipa-server-${{ matrix.os }}-${{matrix.arch}}
        id: download-image
        background: true
      - uses: actions/checkout@v6
      - run: date '+MONTH=%Y-%m' | tee -a $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ipa-client.tar.gz
          key: ipa-client-${{ env.MONTH }}-${{ hashFiles('Dockerfile.test-client') }}-${{ matrix.arch }}
          fail-on-cache-miss: true
        id: download-ipa-client
        background: true
      - uses: ./.github/actions/docker-cgroups-ubuntu-22
        if: matrix.runtime == 'docker'
      - uses: ./.github/actions/install-docker-rootless
        if: matrix.runtime == 'docker rootless'
      - run: $runtime volume create "$VOLUME"
        env:
          VOLUME: ${{ matrix.volume }}
        if: matrix.volume == 'freeipa-data'
        background: true
      - wait: download-ipa-client
      - run: gunzip < ipa-client.tar.gz | $runtime load
        background: true
      - wait: download-image
      - name: Load image
        run: gunzip < "freeipa-server-$OS-$ARCH.tar.gz" | $runtime load
        background: true
      - wait-all:
      - name: Run master and replica
        run: docker="$runtime" tests/run-master-and-replica.sh "localhost/freeipa-server:$OS"
        env:
          readonly: ${{ matrix.readonly }}
          ca: ${{ matrix.ca }}
          VOLUME: ${{ matrix.volume }}
          seccomp: ${{ matrix.seccomp }}
          replica: ${{ matrix.replica }}
      - name: Show package difference
        if: failure()
        run: diff -U 0 <( $runtime run --rm --entrypoint rpm "quay.io/freeipa/freeipa-server:$OS" -qa | sort ) <( $runtime run --rm --entrypoint rpm "localhost/freeipa-server:$OS" -qa | sort ) || true
      - name: Run partial tests
        if: failure()
        run: docker="$runtime" tests/run-partial-tests.sh "Dockerfile.$OS"

  test-upgrade:
    name: Upgrade
    runs-on: ${{ matrix.runs-on }}${{ (matrix.arch == 'arm64' && '-arm') || (matrix.arch == 'x86_64' && '') }}
    needs: [ build, test-plan, build-ipa-client ]
    if: needs.test-plan.outputs.matrix-test-upgrade != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-plan.outputs.matrix-test-upgrade) }}
    timeout-minutes: 20
    env:
      runtime: ${{ matrix.runtime == 'docker rootless' && 'docker' || matrix.runtime }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: freeipa-server-${{ matrix.os }}-${{matrix.arch}}
        id: download-image
        background: true
      - uses: actions/checkout@v6
      - run: date '+MONTH=%Y-%m' | tee -a $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ipa-client.tar.gz
          key: ipa-client-${{ env.MONTH }}-${{ hashFiles('Dockerfile.test-client') }}-${{ matrix.arch }}
          fail-on-cache-miss: true
        id: download-ipa-client
        background: true
      - uses: ./.github/actions/docker-cgroups-ubuntu-22
        if: matrix.runtime == 'docker'
      - uses: ./.github/actions/install-docker-rootless
        if: matrix.runtime == 'docker rootless'
      - name: Populate volume with data using image driver
        run: |
          $runtime pull "quay.io/freeipa/freeipa-server:data-$DATA_FROM" \
            && $runtime volume create --driver image --opt "image=quay.io/freeipa/freeipa-server:data-$DATA_FROM" "$VOLUME"
        env:
          DATA_FROM: ${{ matrix.data-from }}
          VOLUME: ${{ matrix.volume }}
        if: matrix.volume == 'volume-image'
        background: true
      - name: Populate volume directory with data
        run: |
          mkdir -p /tmp/freeipa-data/image \
            && skopeo copy "docker://quay.io/freeipa/freeipa-server:data-$DATA_FROM" dir:/tmp/freeipa-data/image \
            && jq -r '.layers[].digest | sub("sha256:"; "")' /tmp/freeipa-data/image/manifest.json \
                 | while read f ; do $runtime run --rm -v /tmp/freeipa-data:/data:z --workdir /data docker.io/library/busybox tar xf image/$f ; done \
            && rm -rf /tmp/freeipa-data/image
        env:
          DATA_FROM: ${{ matrix.data-from }}
        if: matrix.volume == '' || matrix.volume == 'volume'
      - name: Populate volume with data
        run: |
          $runtime volume create "$VOLUME" \
            && $runtime run --rm -v /tmp/freeipa-data:/data-in:z -v "$VOLUME:/data:z" --workdir /data docker.io/library/busybox cp -a /data-in/. .
        env:
          VOLUME: ${{ matrix.volume }}
        if: matrix.volume == 'volume'
        background: true
      - wait: download-ipa-client
      - run: gunzip < ipa-client.tar.gz | $runtime load
        background: true
      - wait: download-image
      - name: Load image
        run: gunzip < "freeipa-server-$OS-$ARCH.tar.gz" | $runtime load
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        background: true
      - wait-all:
      - name: Run master and replica
        run: docker="$runtime" tests/run-master-and-replica.sh "localhost/freeipa-server:$OS"
        env:
          readonly: ${{ matrix.readonly }}
          VOLUME: ${{ matrix.volume != '' && matrix.volume || '/tmp/freeipa-data' }}
          OS: ${{ matrix.os }}

  test-k8s:
    name: Run in K8s
    runs-on: ${{ matrix.runs-on }}${{ (matrix.arch == 'arm64' && '-arm') || (matrix.arch == 'x86_64' && '') }}
    needs: [ build, test-plan, build-ipa-client ]
    if: needs.test-plan.outputs.matrix-k8s != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-plan.outputs.matrix-k8s ) }}
    timeout-minutes: 40
    env:
      CRIO_VERSION: v1.37
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: freeipa-server-${{ matrix.os }}-${{matrix.arch}}
        id: download-image
        background: true
      - run: test -f /sys/fs/cgroup/cgroup.controllers
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-crio
        if: matrix.runtime == 'cri-o'
      - uses: ./.github/actions/docker-cgroups-ubuntu-22
        if: matrix.runtime == 'docker'
      - run: sudo systemctl stop docker && sudo rm -f /var/run/docker.sock
        if: matrix.runtime != 'docker'
      - uses: ./.github/actions/install-containerd-2.4
        if: matrix.runtime == 'containerd' && matrix.kubernetes != 'k3s'
      - run: sudo systemctl stop containerd
        if: matrix.runtime == 'containerd' && matrix.kubernetes == 'k3s'
      - uses: ./.github/actions/install-k8s
        env:
          KUBERNETES_VERSION: v1.37
        if: matrix.kubernetes == 'kubeadm init'
      - uses: ./.github/actions/install-k3s
        if: matrix.kubernetes == 'k3s'
      - uses: ./.github/actions/install-rke2
        if: matrix.kubernetes == 'rke2'
      - uses: ./.github/actions/install-k0s
        if: matrix.kubernetes == 'k0s'
      - run: patch tests/freeipa-k8s.yaml < tests/freeipa-k8s.yaml.docker.patch
        if: matrix.runtime == 'docker'
        background: true
      - run: patch tests/freeipa-replica-k8s.yaml < tests/freeipa-k8s.yaml.docker.patch
        if: matrix.runtime == 'docker'
        background: true
      - run: patch tests/freeipa-k8s.yaml < tests/freeipa-k8s.yaml.containerd.patch
        if: matrix.runtime == 'containerd'
        background: true
      - run: patch tests/freeipa-replica-k8s.yaml < tests/freeipa-k8s.yaml.containerd.patch
        if: matrix.runtime == 'containerd'
        background: true
      - run: date '+MONTH=%Y-%m' | tee -a $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ipa-client.tar.gz
          key: ipa-client-${{ env.MONTH }}-${{ hashFiles('Dockerfile.test-client') }}-${{ matrix.arch }}
          fail-on-cache-miss: true
        id: download-ipa-client
        background: true
      - wait: download-ipa-client
      - run: gunzip < ipa-client.tar.gz | podman load
        background: true
      - wait: download-image
      - run: sudo skopeo copy "oci-archive:freeipa-server-$OS-$ARCH.tar.gz" "containers-storage:localhost/freeipa-server:$OS"
        if: matrix.runtime == 'cri-o'
      - name: Load image to docker
        run: gunzip < "freeipa-server-$OS-$ARCH.tar.gz" | docker load
        if: matrix.runtime == 'docker'
      - name: Load image to containerd
        run: gunzip < "freeipa-server-$OS-$ARCH.tar.gz" | sudo ctr -n k8s.io images import -
        if: matrix.runtime == 'containerd' && matrix.kubernetes != 'k3s'
      - name: Load image to containerd in K3s
        run: gunzip < "freeipa-server-$OS-$ARCH.tar.gz" | sudo k3s ctr images import -
        if: matrix.runtime == 'containerd' && matrix.kubernetes == 'k3s'
      - wait-all:
      - name: Run master and replica in K8s
        run: tests/run-in-k8s.sh "localhost/freeipa-server:$OS"

  push-after-success:
    name: Push images to registries
    runs-on: ubuntu-24.04
    needs: [ master-and-replica, test-upgrade, test-k8s, test-plan ]
    if: needs.test-plan.outputs.matrix-push != '[]' && github.event_name != 'pull_request' && github.repository == 'freeipa/freeipa-container' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.test-plan.outputs.matrix-push ) }}
    timeout-minutes: 30
    env:
      OS: ${{ matrix.os }}
    steps:
      - run: |
          export ARCHES=$( jq -cn '$ENV.MATRIX_PUSH_DATA | fromjson | map(select(.os == $ENV.OS)) | .[].arch' )
          echo "ARCHES=$ARCHES" | tee -a $GITHUB_ENV
          jq -cjn '"ARCHES_NUM=", ($ENV.ARCHES | fromjson | length), "\n"' | tee -a $GITHUB_ENV
          jq -cjn '"ARCH0=", ($ENV.ARCHES | fromjson | .[0]), "\n"' | tee -a $GITHUB_ENV
        env:
          MATRIX_PUSH_DATA: ${{ needs.test-plan.outputs.matrix-push-data }}
      - parallel:
          - uses: actions/download-artifact@v8
            with:
              name: freeipa-server-${{ env.OS }}-${{ env.ARCH0 }}
            if: env.ARCHES_NUM == 1
          - uses: actions/download-artifact@v8
            with:
              pattern: freeipa-server-${{ env.OS }}-*
              merge-multiple: true
            if: env.ARCHES_NUM != 1
          - name: Prepare authentication file
            run: echo "$REGISTRY_CREDENTIALS_FILE" > auth.json
            env:
              REGISTRY_CREDENTIALS_FILE: ${{ secrets.REGISTRY_CREDENTIALS_FILE }}
      - run: |
          jq -nr '$ENV.ARCHES | fromjson[] | "oci-archive:freeipa-server-" + $ENV.OS + "-" + . + ".tar.gz"' \
          | xargs podman manifest create "freeipa-server:$OS"
        if: env.ARCHES_NUM != 1
      - name: Copy ${{ matrix.os }} to registries
        run: |
          set -e
          f="oci-archive:freeipa-server-$OS-$ARCH0.tar.gz"
          while read r ; do
            echo "Copying freeipa-server:$OS to ${r#docker://}"
            if [ "$ARCHES_NUM" -eq 1 ] ; then
              skopeo copy --authfile=auth.json $f "$r:$OS"
            else
              podman manifest push --authfile=auth.json "freeipa-server:$OS" "$r:$OS"
            fi
            VERSION=$( skopeo inspect --format='{{index .Labels "org.opencontainers.image.version"}}' $f | sed 's/-.*//' )
            test -n "$VERSION"
            skopeo copy --authfile=auth.json --all "$r:$OS" "$r:$OS-$VERSION"
            echo "Tagged as $OS-$VERSION as well"
          done << EOF
          $REGISTRY_TARGET_LIST
          EOF
        env:
          REGISTRY_TARGET_LIST: ${{ secrets.REGISTRY_TARGET_LIST }}

