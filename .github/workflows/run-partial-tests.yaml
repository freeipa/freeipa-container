name: tests/run-partial-tests.sh
run-name: tests/run-partial-tests.sh${{ github.event_name == 'workflow_dispatch' && ! inputs.full && format(' Dockerfile.{0} with {1}', inputs.os, inputs.docker) || ' all' }} @ ${{ inputs.runs-on == '' && 'ubuntu-24.04' || inputs.runs-on }}

on:
  schedule:
    - cron: '42 3 1,15 * *'
  workflow_dispatch:
    inputs:
      full:
        description: Full set of tests
        required: true
        type: boolean
        default: false
      os:
        description: OS / Dockerfile
        type: string
      docker:
        description: docker or podman
        type: choice
        options:
          - docker
          - podman
      runs-on:
        description: Host Ubuntu version
        type: choice
        options:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gen-matrix:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: github.event_name != 'schedule' || github.repository == 'freeipa/freeipa-container'
    outputs:
      matrix-os: ${{ steps.dispatch-matrix.outputs.os }}${{ steps.default-matrix.outputs.os }}
      matrix-docker: ${{ steps.dispatch-matrix.outputs.docker }}${{ steps.default-matrix.outputs.docker }}
      matrix-include: ${{ steps.rhel-include.outputs.include }}
      runs-on: ${{ steps.get-runs-on.outputs.runs-on }}
    env:
      HAS_REDHAT_CREDENTIALS: ${{ secrets.REDHAT_ORG != '' && secrets.REDHAT_ACTIVATIONKEY != '' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v6
      - id: default-matrix
        run: |
          echo 'os<<EOS' >> $GITHUB_OUTPUT
          yq -r -o json '[ .on.workflow_dispatch.inputs.os.options[] | select(. != "all") ]' .github/workflows/build-test.yaml | tee -a $GITHUB_OUTPUT
          echo EOS >> $GITHUB_OUTPUT
          echo -n 'docker=[ "docker", "podman" ]' >> $GITHUB_OUTPUT
        if: github.event_name != 'workflow_dispatch' || inputs.full
      - id: rhel-include
        run: |
          echo 'include<<EOS' >> $GITHUB_OUTPUT
          yq -o json '[ .jobs.build-test-rhel-podman.strategy.matrix.os[] | { "os": ., "docker": "podman" } ]' .github/workflows/test-rhel.yaml | tee -a $GITHUB_OUTPUT
          echo EOS >> $GITHUB_OUTPUT
        if: env.HAS_REDHAT_CREDENTIALS
      - id: dispatch-matrix
        run: |
          exec > >( tee -a $GITHUB_OUTPUT )
          echo "os=$OS"
          echo "docker=$DOCKER"
        env:
          OS: ${{ inputs.os }}
          DOCKER: ${{ inputs.docker }}
        if: steps.default-matrix.outputs.os == ''
      - id: get-runs-on
        run: |
          RUNS_ON=${RUNS_ON:-ubuntu-26.04}
          echo "runs-on=$RUNS_ON" | tee -a $GITHUB_OUTPUT
        env:
          RUNS_ON: ${{ inputs.runs-on }}

  test:
    runs-on: ${{ needs.gen-matrix.outputs.runs-on }}
    needs: [ gen-matrix ]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.gen-matrix.outputs.matrix-os) }}
        docker: ${{ fromJSON(needs.gen-matrix.outputs.matrix-docker) }}
        include: ${{ fromJSON(needs.gen-matrix.outputs.matrix-include) }}
    if: github.event_name != 'schedule' || github.repository == 'freeipa/freeipa-container'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - parallel:
          - uses: ./.github/actions/docker-cgroups-ubuntu-22
            if: matrix.docker == 'docker'
          - run: mkdir -p ~/.config/containers && cp ci/containers-podman-5.conf ~/.config/containers/containers.conf
            if: matrix.docker == 'podman'
          - run: sudo apt update && sudo apt install -y apparmor-utils && sudo aa-complain --profile hostname smbd
            if: startsWith(needs.gen-matrix.outputs.runs-on, 'ubuntu-26.04') && matrix.docker == 'podman' && endsWith(matrix.os, '-8')
          - name: For RHEL builds, use entitlements
            if: ${{ startsWith(matrix.os, 'rhel-') }}
            uses: redhat-actions/common/podman-entitlement@19c680ff95a52ee905481b54fc08d5c47788600c    # @v2.1.0
            with:
              org: ${{ secrets.REDHAT_ORG }}
              activationkey: ${{ secrets.REDHAT_ACTIVATIONKEY }}
      - name: Run partial tests
        run: tests/run-partial-tests.sh "Dockerfile.$OS"
        env:
          docker: ${{ matrix.docker }}
          OS: ${{ matrix.os }}
